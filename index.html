<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ollama Chat</title>
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try {
    var t = JSON.parse(localStorage.getItem('ollamachat.theme'));
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
:root {
  --bg: #ffffff;
  --bg-side: #f4f5f7;
  --bg-hover: #e9ebef;
  --bg-active: #dfe3e8;
  --ink: #1f2328;
  --ink-2: #59616b;
  --ink-3: #8a929c;
  --line: #e3e6ea;
  --accent: #23735f;
  --accent-ink: #ffffff;
  --accent-soft: #e3f1ed;
  --bubble: #eef0f3;
  --code-bg: #f5f6f8;
  --code-head: #eaecf0;
  --danger: #c23b32;
  --ok: #2a9d6f;
  --shadow: 0 1px 2px rgba(20, 24, 30, .06), 0 10px 30px rgba(20, 24, 30, .07);
  --radius: 14px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #1b1d21;
  --bg-side: #141619;
  --bg-hover: #23262b;
  --bg-active: #2c3036;
  --ink: #e8eaed;
  --ink-2: #aab0b8;
  --ink-3: #7a828c;
  --line: #2c3036;
  --accent: #4fb99a;
  --accent-ink: #0f1a17;
  --accent-soft: #1f302b;
  --bubble: #2a2d33;
  --code-bg: #13151a;
  --code-head: #22252b;
  --danger: #ef6b60;
  --ok: #4fb99a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

.app { display: flex; height: 100vh; height: 100dvh; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 290px; flex: none; display: flex; flex-direction: column;
  background: var(--bg-side); border-right: 1px solid var(--line);
}
.side-top { padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; padding: 0 6px; }
.brand .mark {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink);
}
.btn-new {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); font-weight: 550;
}
.btn-new:hover { background: var(--bg-hover); }

.list-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 4px; color: var(--ink-3); font-size: 12.5px; }
.link-btn { background: none; border: 0; padding: 2px 4px; color: var(--ink-3); font-size: 12.5px; border-radius: 6px; }
.link-btn:hover { color: var(--danger); background: var(--bg-hover); }

.sessions { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
.group-label { padding: 12px 10px 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.s-item { position: relative; display: flex; align-items: center; border-radius: 9px; }
.s-item:hover { background: var(--bg-hover); }
.s-item.active { background: var(--bg-active); }
.s-open {
  flex: 1; min-width: 0; text-align: left; background: none; border: 0;
  padding: 8px 10px; border-radius: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-size: 14px;
}
.s-del {
  flex: none; margin-right: 4px; width: 28px; height: 28px; border: 0; border-radius: 7px;
  background: none; color: var(--ink-3); display: none; place-items: center;
}
.s-item:hover .s-del, .s-item.active .s-del, .s-del:focus-visible { display: grid; }
.s-del:hover { color: var(--danger); background: var(--bg-active); }
.empty-list { padding: 18px 12px; color: var(--ink-3); font-size: 13.5px; }

.side-foot { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.lbl { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.url-row { display: flex; gap: 6px; }
.url-row input {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--bg);
}
.url-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn-sm {
  padding: 8px 12px; border-radius: 9px; border: 0; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
}
.btn-sm:hover { filter: brightness(1.08); }
.btn-sm:disabled { opacity: .55; cursor: default; }
.status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-height: 22px; }
.status .grow { flex: 1; min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status.ok .dot { background: var(--ok); }
.status.err .dot { background: var(--danger); }
.status.busy .dot { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.tips { font-size: 12.5px; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.tips code { font-family: var(--mono); font-size: 11.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 4px; word-break: break-all; }
.icon-btn {
  width: 32px; height: 32px; border: 0; border-radius: 8px; background: none;
  display: inline-grid; place-items: center; color: var(--ink-2);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--ink); }

.models-box { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.models-box summary { cursor: pointer; padding: 7px 10px; font-size: 13px; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
.models-box summary::-webkit-details-marker { display: none; }
.models-box summary::after { content: "\25BE"; color: var(--ink-3); }
.models-box[open] summary::after { content: "\25B4"; }
#modelList { list-style: none; margin: 0; padding: 0 4px 6px; max-height: 170px; overflow-y: auto; }
#modelList li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 6px; font-size: 13px; border-radius: 6px; }
#modelList li:hover { background: var(--bg-hover); }
#modelList .sz { color: var(--ink-3); white-space: nowrap; font-size: 12px; }
#modelList .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foot-row { display: flex; justify-content: space-between; align-items: center; }
.foot-row span { font-size: 12.5px; color: var(--ink-3); }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { height: 54px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.topbar .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; max-width: 46vw;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg);
  font-size: 13.5px; color: var(--ink-2);
}
.chip:hover { background: var(--bg-hover); color: var(--ink); }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scroll { flex: 1; overflow-y: auto; scroll-behavior: auto; }
.thread { max-width: 780px; margin: 0 auto; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 22px; }

.msg.user { display: flex; justify-content: flex-end; }
.bubble {
  background: var(--bubble); padding: 10px 16px; border-radius: 20px 20px 6px 20px;
  max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.assistant { display: flex; gap: 14px; align-items: flex-start; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; flex: none; margin-top: 2px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
}
.body { flex: 1; min-width: 0; }

.think { margin-bottom: 8px; border-left: 2px solid var(--line); padding-left: 12px; color: var(--ink-2); font-size: 14px; }
.think summary { cursor: pointer; color: var(--ink-3); font-size: 13.5px; }
.think-body { white-space: pre-wrap; margin-top: 6px; }

.meta { display: flex; align-items: center; gap: 2px; margin-top: 6px; min-height: 30px; }
.meta:empty { min-height: 0; margin: 0; }
.meta .ghost { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--ink-3); display: grid; place-items: center; }
.meta .ghost:hover { background: var(--bg-hover); color: var(--ink); }
.meta .stat { margin-left: 8px; font-size: 12.5px; color: var(--ink-3); display: flex; gap: 12px; }

.retry { display: flex; justify-content: center; }
.retry button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.retry button:hover { background: var(--bg-hover); }

/* Markdown */
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 20px 0 8px; line-height: 1.3; }
.md h1 { font-size: 1.5em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.12em; } .md h4, .md h5, .md h6 { font-size: 1em; }
.md ul, .md ol { margin: 0 0 12px; padding-left: 1.5em; }
.md li { margin: 3px 0; }
.md li > ul, .md li > ol { margin: 3px 0 0; }
.md a { color: var(--accent); text-underline-offset: 2px; }
.md blockquote { margin: 0 0 12px; padding: 2px 0 2px 14px; border-left: 3px solid var(--line); color: var(--ink-2); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.md code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
.md .code { margin: 0 0 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--code-bg); }
.md .code-head { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px 4px 12px; background: var(--code-head); font-size: 12.5px; color: var(--ink-2); }
.md .code-head button { border: 0; background: none; padding: 3px 8px; border-radius: 6px; color: var(--ink-2); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.md .code-head button:hover { background: var(--bg-hover); color: var(--ink); }
.md pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; font-size: 13.5px; line-height: 1.55; white-space: pre; }
.md .tbl { overflow-x: auto; margin: 0 0 14px; }
.md table { border-collapse: collapse; font-size: 14px; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 12px; text-align: left; }
.md th { background: var(--code-bg); font-weight: 600; }
.streaming .md > :last-child::after {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 5px; border-radius: 50%;
  background: var(--accent); animation: pulse 1s ease-in-out infinite; vertical-align: middle;
}
.streaming .md > .code:last-child::after, .streaming .md > .tbl:last-child::after { display: none; }
.typing { display: inline-flex; gap: 4px; padding: 8px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: bounce 1.1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

/* Welcome / setup */
.welcome { max-width: 620px; margin: 0 auto; padding: 6vh 0 0; text-align: center; }
.welcome .big-mark { width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.welcome h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -.01em; }
.welcome p.lead { margin: 0 0 26px; color: var(--ink-2); }
.setup { text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--bg-side); display: grid; gap: 14px; }
.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.settings-grid .field { min-width: 0; }
.field input[type="number"], .field input[type="text"] {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg);
}
.range-row { display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center; }
.range-row input[type="range"] { width: 100%; accent-color: var(--accent); }
.range-row output {
  display: block; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px;
  text-align: center; font-family: var(--mono); font-size: 12px; background: var(--bg);
}
.setting-hint { margin: -2px 0 0; font-size: 11.5px; color: var(--ink-3); }
.cfg-section { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.cfg-section h4 { margin: 0; font-size: 13px; color: var(--ink-2); }
.cfg-summary {
  font-size: 11.5px; color: var(--ink-3); padding: 8px 10px; border-radius: 9px;
  background: var(--code-bg); border: 1px solid var(--line);
}
@media (max-width: 560px) { .settings-grid { grid-template-columns: 1fr; } }

.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
select, textarea.plain {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
}
textarea.plain { resize: vertical; min-height: 84px; line-height: 1.5; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; color: var(--ink-2); }
.pill:hover { background: var(--bg-hover); color: var(--ink); }
.suggest { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 18px; }
.suggest button { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; color: var(--ink-2); }
.suggest button:hover { background: var(--bg-hover); color: var(--ink); }
.primary-btn { padding: 9px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary-btn:hover { filter: brightness(1.08); }

/* Composer */
.banner {
  max-width: 780px; width: calc(100% - 40px); margin: 0 auto 8px; padding: 10px 12px 10px 14px;
  border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
  background: color-mix(in srgb, var(--danger) 9%, var(--bg));
  border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
}
.banner[hidden] { display: none; }
.banner span { flex: 1; overflow-wrap: anywhere; }
.banner button { border: 0; background: none; color: var(--ink-2); padding: 0 4px; font-size: 18px; line-height: 1; }
.composer-wrap { padding: 4px 20px calc(14px + env(safe-area-inset-bottom)); }
.composer {
  max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 8px 8px 18px; border: 1px solid var(--line); border-radius: 26px;
  background: var(--bg); box-shadow: var(--shadow);
}
.composer:focus-within { border-color: var(--accent); }
.composer textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; resize: none;
  max-height: 200px; padding: 6px 0; line-height: 1.55;
}
.composer textarea::placeholder { color: var(--ink-3); }
.send {
  width: 36px; height: 36px; border-radius: 50%; border: 0; flex: none;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
}
.send:disabled { background: var(--bg-active); color: var(--ink-3); cursor: default; }
.foot-note { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--ink-3); }

/* Dialog */
dialog {
  width: calc(100% - 32px); max-width: 520px; padding: 0; border: 1px solid var(--line);
  border-radius: 18px; background: var(--bg); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(10, 12, 16, .5); }
.dlg { padding: 20px; display: grid; gap: 14px; }
.dlg h3 { margin: 0; font-size: 18px; }
.dlg .hint { margin: 0; font-size: 13px; color: var(--ink-3); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.ghost-btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.ghost-btn:hover { background: var(--bg-hover); }

.scrim { display: none; }

@media (max-width: 820px) {
  .sidebar { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(310px, 86vw); transform: translateX(-102%); transition: transform .2s ease; box-shadow: var(--shadow); }
  .app.nav-open .sidebar { transform: none; }
  .app.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 16, .45); }
  .menu-btn { display: inline-grid; }
  .thread, .composer-wrap { padding-left: 14px; padding-right: 14px; }
  .msg.assistant { gap: 10px; }
  .welcome h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="Chats and connection">
    <div class="side-top">
      <div class="brand"><span class="mark" id="brandMark"></span>Ollama Chat</div>
      <button class="btn-new" id="newChat" type="button"></button>
    </div>

    <div class="list-head"><span>Chats</span><button class="link-btn" id="clearAll" type="button">Clear all</button></div>
    <nav class="sessions" id="sessionList" aria-label="Chat history"></nav>

    <div class="side-foot">
      <label class="lbl" for="urlInput">Ollama URL</label>
      <form class="url-row" id="urlForm" autocomplete="off">
        <input id="urlInput" type="text" inputmode="url" placeholder="http://localhost:11434" spellcheck="false" autocapitalize="off">
        <button class="btn-sm" id="connectBtn" type="submit">Connect</button>
      </form>
      <div class="status" id="status"></div>
      <div class="tips" id="tips" hidden></div>
      <details class="models-box" id="modelsBox">
        <summary><span id="modelCount">Models</span></summary>
        <ul id="modelList"></ul>
      </details>
      <div class="foot-row">
        <span>Saved in this browser</span>
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open sidebar"></button>
      <div class="title" id="chatTitle">New chat</div>
      <button class="chip" id="sessionCfg" type="button" title="Model and system prompt for this chat" hidden></button>
    </header>

    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>

    <div class="banner" id="banner" hidden role="alert"><span id="bannerText"></span><button id="bannerClose" type="button" aria-label="Dismiss">&times;</button></div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message"></textarea>
        <button class="send" id="sendBtn" type="button" aria-label="Send"></button>
      </div>
      <div class="foot-note" id="footNote">Enter to send, Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<dialog id="cfgDialog">
  <div class="dlg">
    <h3>Chat settings</h3>
    <div class="field"><label for="cfgModel">Model</label><select id="cfgModel"></select></div>
    <div class="field"><label for="cfgSystem">System prompt</label><textarea class="plain" id="cfgSystem" rows="6" placeholder="Optional. Tell the model how to behave."></textarea></div>
    <div id="cfgSettings"></div>
    <p class="hint">Changes apply to your next message. Existing messages remain unchanged. Blank/default fields are not sent to Ollama.</p>
    <div class="dlg-actions">
      <button class="ghost-btn" id="cfgCancel" type="button">Cancel</button>
      <button class="primary-btn" id="cfgSave" type="button">Save changes</button>
    </div>
  </div>
</dialog>

<script>
(() => {
'use strict';

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const svg = (paths, size = 18, sw = 2) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const I = {
  logo:  svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', 16),
  logoL: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', 26),

  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('Storage failed', e); return false; } }
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const timeoutSignal = ms => {
  if (AbortSignal.timeout) return AbortSignal.timeout(ms);
  const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal;
};
const fmtSize = b => !b ? '' : b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : (b / 1e6).toFixed(0) + ' MB';
const normalizeUrl = raw => {
  let u = (raw || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  return u.replace(/\/api(\/.*)?$/i, '').replace(/\/+$/, '');
};

const DEFAULT_OPTIONS = {
  temperature: null,
  top_p: null,
  top_k: null,
  min_p: null,
  repeat_penalty: null,
  seed: null,
  num_ctx: null,
  num_predict: null,
  think: null
};

function normalizeOptions(o) {
  o = (o && typeof o === 'object') ? o : {};
  return {
    temperature: finiteOrNull(o.temperature),
    top_p: finiteOrNull(o.top_p),
    top_k: integerOrNull(o.top_k),
    min_p: finiteOrNull(o.min_p),
    repeat_penalty: finiteOrNull(o.repeat_penalty),
    seed: integerOrNull(o.seed),
    num_ctx: integerOrNull(o.num_ctx),
    num_predict: integerOrNull(o.num_predict),
    think: ['true','false','low','medium','high','max'].includes(String(o.think)) ? String(o.think) : null
  };
}

function finiteOrNull(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function integerOrNull(v) {
  const n = finiteOrNull(v);
  return n === null ? null : Math.trunc(n);
}

function ensureSessionOptions(s) {
  s.options = normalizeOptions(s.options);
  return s.options;
}

function settingsValue(v, fallback = '') {
  return v === null || v === undefined ? fallback : String(v);
}

  if (o.think !== null) parts.push(`think ${o.think}`);
  return parts.length ? `Custom: ${parts.join(' · ')}` : 'Using Ollama/model defaults';
}

/* ================= Markdown ================= */
function inline(t) {
  t = esc(t);
  const codes = [];
  t = t.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
       .replace(/__(.+?)__/g, '<strong>$1</strong>')
       .replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)(?<!\s)\*(?!\*)/g, '$1<em>$2</em>')
       .replace(/~~(.+?)~~/g, '<del>$1</del>')
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return t.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + codes[i] + '</code>');
}

function codeBlock(b) {
  return `<div class="code"><div class="code-head"><span>${esc(b.lang || 'text')}</span>` +
    `<button type="button" data-act="copy-code">${I.copy}<span>Copy</span></button></div>` +
    `<pre><code>${esc(b.code)}</code></pre></div>`;
}

const RE_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const RE_HR = /^\s*([-*_])(\s*\1){2,}\s*$/;
const RE_TBL_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
const isBlockStart = l => /^\s*(#{1,6}\s|>)/.test(l) || RE_LIST.test(l) || RE_HR.test(l) || /^\u0000\d+\u0000$/.test(l);

function parseList(lines, i, blocks) {
  const first = lines[i].match(RE_LIST);
  const base = first[1].length;
  const tag = /\d/.test(first[2]) ? 'ol' : 'ul';
  let html = `<${tag}>`;
  while (i < lines.length) {
    const m = lines[i].match(RE_LIST);
    if (!m || m[1].length !== base) break;
    let content = m[3]; i++;
    const nested = [];
    while (i < lines.length) {
      const nm = lines[i].match(RE_LIST);
      if (nm && nm[1].length > base) { nested.push(lines[i]); i++; }
      else if (!nm && lines[i].trim() && lines[i].match(/^\s*/)[0].length > base) { content += ' ' + lines[i].trim(); i++; }
      else break;
    }
    html += `<li>${inline(content)}`;
    if (nested.length) html += parseList(nested, 0, blocks).html;
    html += '</li>';
    if (i + 1 < lines.length && !lines[i].trim()) {
      const nx = lines[i + 1].match(RE_LIST);
      if (nx && nx[1].length === base) i++;
    }
  }
  return { html: html + `</${tag}>`, next: i };
}

function parseBlocks(src, blocks) {
  const lines = src.split('\n');
  let out = '', i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) { out += codeBlock(blocks[+m[1]]); i++; continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (RE_HR.test(line)) { out += '<hr>'; i++; continue; }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out += `<blockquote>${parseBlocks(buf.join('\n'), blocks)}</blockquote>`; continue;
    }
    if (RE_LIST.test(line)) { const r = parseList(lines, i, blocks); out += r.html; i = r.next; continue; }
    if (line.includes('|') && i + 1 < lines.length && RE_TBL_SEP.test(lines[i + 1]) && lines[i + 1].includes('-')) {
      const split = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = split(line);
      const al = split(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) { rows.push(split(lines[i])); i++; }
      out += '<div class="tbl"><table><thead><tr>' + head.map((h, k) => `<th style="text-align:${al[k] || 'left'}">${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' + rows.map(r => '<tr>' + head.map((_, k) => `<td style="text-align:${al[k] || 'left'}">${inline(r[k] || '')}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>';
      continue;
    }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) { buf.push(lines[i]); i++; }
    out += `<p>${inline(buf.join('\n')).replace(/\n/g, '<br>')}</p>`;
  }
  return out;
}

function md(src) {
  const blocks = [];
  src = (src || '').replace(/```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
    blocks.push({ lang, code: code.replace(/\n$/, '') });
    return '\n\u0000' + (blocks.length - 1) + '\u0000\n';
  });
  return parseBlocks(src, blocks);
}

function splitThink(m) {
  let thinking = m.thinking || '', content = m.content || '';
  const mm = content.match(/^\s*<think>([\s\S]*?)(<\/think>|$)/);
  if (mm) {
    thinking = (thinking ? thinking + '\n' : '') + mm[1].trim();
    content = content.slice(mm[0].length).replace(/^\s+/, '');
  }
  return { thinking, content };
}

/* ================= Connection ================= */
function pickDefaultModel() {
  const names = S.models.map(m => m.name);
  const last = store.get(K.model, '');
  return names.includes(last) ? last : (names[0] || '');
}

async function connect(raw) {
  const url = normalizeUrl(raw);
  if (!url) { S.connected = false; S.connectError = 'Enter the address of your Ollama server.'; renderConnection(); return; }
  S.url = url; store.set(K.url, url);
  $('#urlInput').value = url;
  S.connecting = true; S.connectError = ''; renderConnection();
  try {
    const r = await fetch(url + '/api/tags', { signal: timeoutSignal(8000) });
    if (!r.ok) throw new Error('Ollama answered with HTTP ' + r.status);
    const j = await r.json();
    S.models = (j.models || []).map(m => ({ name: m.name || m.model, size: m.size || 0 }))
      .sort((a, b) => a.name.localeCompare(b.name));
    S.connected = true;
  } catch (e) {
    S.connected = false; S.models = [];
    S.connectError = (e instanceof TypeError || e.name === 'TimeoutError' || e.name === 'AbortError')
      ? 'Could not reach Ollama at this address.' : (e.message || 'Connection failed.');
  }
  S.connecting = false;
  const s = cur();
  if (s && S.connected && !s.messages.length && !S.models.some(m => m.name === s.model)) s.model = pickDefaultModel();
  renderAll();
}

function renderConnection() {
  const st = $('#status'), tips = $('#tips');
  st.className = 'status';
  $('#connectBtn').disabled = S.connecting;
  if (S.connecting) {
    st.classList.add('busy'); st.innerHTML = '<span class="dot"></span><span class="grow">Connecting…</span>';
  } else if (S.connected) {
    st.classList.add('ok');
    st.innerHTML = `<span class="dot"></span><span class="grow">Connected, ${S.models.length} model${S.models.length === 1 ? '' : 's'}</span>`;
  } else if (S.connectError) {
    st.classList.add('err'); st.innerHTML = `<span class="dot"></span><span class="grow">${esc(S.connectError)}</span>`;
  } else {
    st.innerHTML = '<span class="dot"></span><span class="grow">Not connected</span>';
  }
  const showTips = !S.connecting && !S.connected && !!S.connectError && S.url;
  tips.hidden = !showTips;
  if (showTips) {
    tips.innerHTML = 'Check that Ollama is running. If the browser blocks the request (CORS), restart Ollama with ' +
      '<code>OLLAMA_ORIGINS="*" ollama serve</code>. A page opened over https cannot call an http address.';
  }
  const list = $('#modelList');
  $('#modelCount').textContent = S.connected ? `Models (${S.models.length})` : 'Models';
  list.innerHTML = S.connected
    ? (S.models.length
        ? S.models.map(m => `<li><span class="nm" title="${esc(m.name)}">${esc(m.name)}</span><span class="sz">${fmtSize(m.size)}</span></li>`).join('')
        : '<li><span class="nm">No models installed. Run: ollama pull llama3.2</span></li>')
    : '<li><span class="nm">Connect to see installed models</span></li>';
  if (S.connected && S.models.length) $('#modelsBox').open = $('#modelsBox').open || false;
}

/* ================= Sessions ================= */
function titleFrom(text) {
  const t = text.trim().split('\n')[0].replace(/\s+/g, ' ');
  return t.length > 48 ? t.slice(0, 46) + '…' : t || 'New chat';
}

function newChat() {
  const empty = S.sessions.find(x => !x.messages.length);
  if (empty) { empty.updatedAt = Date.now(); switchTo(empty.id); return; }
  const s = { id: uid(), title: 'New chat', model: pickDefaultModel(), system: store.get(K.system, ''), options: normalizeOptions(store.get('ollamachat.lastOptions', {})), messages: [], createdAt: Date.now(), updatedAt: Date.now() };
  S.sessions.unshift(s);
  switchTo(s.id);
}

function switchTo(id) {
  S.currentId = id;
  S.sessions = S.sessions.filter(x => x.id === id || x.messages.length);
  save(); closeNav(); hideBanner(); renderAll();
  if (!cur().messages.length) $('#input').focus({ preventScroll: true });
}

function deleteSession(id) {
  if (S.stream && S.stream.sessionId === id) { S.stream.abort.abort(); S.stream = null; }
  S.sessions = S.sessions.filter(x => x.id !== id);
  if (S.currentId === id) { S.currentId = null; newChat(); return; }
  save(); renderAll();
}

function clearAll() {
  if (!S.sessions.some(s => s.messages.length)) return;
  if (!confirm('Delete all chats? This cannot be undone.')) return;
  if (S.stream) { S.stream.abort.abort(); S.stream = null; }
  S.sessions = []; S.currentId = null;
  newChat();
}

function groupOf(t) {
  const d = new Date(), day = 864e5;
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return t >= start ? 'Today' : t >= start - day ? 'Yesterday' : t >= start - 7 * day ? 'Previous 7 days' : 'Older';
}

function renderSidebar() {
  const box = $('#sessionList');
  const list = [...S.sessions].sort((a, b) => b.updatedAt - a.updatedAt);
  if (!list.length) { box.innerHTML = '<div class="empty-list">No chats yet.</div>'; return; }
  let html = '', last = '';
  for (const s of list) {
    const g = groupOf(s.updatedAt);
    if (g !== last) { html += `<div class="group-label">${g}</div>`; last = g; }
    html += `<div class="s-item${s.id === S.currentId ? ' active' : ''}" data-id="${s.id}">` +
      `<button class="s-open" type="button" data-act="open" title="${esc(s.title)}">${esc(s.messages.length ? s.title : 'New chat')}</button>` +
      `<button class="s-del" type="button" data-act="delete" title="Delete chat" aria-label="Delete chat">${I.trash}</button></div>`;
  }
  box.innerHTML = html;
}

function modelOptions(selected) {

  let html = names.map(m => `<option value="${esc(m.name)}"${m.name === selected ? ' selected' : ''}>${esc(m.name)}${m.size ? ' (' + fmtSize(m.size) + ')' : ''}</option>`).join('');
  if (selected && !names.some(m => m.name === selected)) html = `<option value="${esc(selected)}" selected>${esc(selected)} (not installed)</option>` + html;
  if (!html) html = '<option value="">No models available</option>';
  return html;
}

function welcomeNode(s) {
  const w = document.createElement('div');
  w.className = 'welcome';
  if (!S.connected) {
    w.innerHTML = `<div class="big-mark">${I.logoL}</div><h1>Connect to Ollama</h1>` +
      `<p class="lead">Enter the address of your Ollama server in the sidebar. Models installed on it will show up here.</p>` +
      `<button class="primary-btn" type="button" data-act="focus-url">Enter Ollama URL</button>`;
    return w;
  }
  w.innerHTML = `<div class="big-mark">${I.logoL}</div><h1>What should we work on?</h1>` +
    `<p class="lead">Pick a model, system prompt, sampling/output limits, and thinking mode for this chat, then start typing.</p>` +
    `<div class="setup">` +
      `<div class="field"><label for="setupModel">Model</label><select id="setupModel">${modelOptions(s.model)}</select></div>` +
      `<div class="field"><label for="setupSystem">System prompt</label>` +
        `<textarea class="plain" id="setupSystem" placeholder="Optional. Tell the model how to behave.">${esc(s.system || '')}</textarea>` +
        `<div class="presets">${Object.keys(PRESETS).map(k => `<button class="pill" type="button" data-act="preset" data-key="${k}">${k}</button>`).join('')}` +
        `<button class="pill" type="button" data-act="preset" data-key="">Clear</button></div></div>` +
      renderSettingsFields(s, 'setup') +
    `</div>` +
    `<div class="suggest">${SUGGESTIONS.map(t => `<button type="button" data-act="suggest" data-text="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  return w;
}

function msgNode(m, i, s, isLast) {
  const n = document.createElement('div');
  n.className = 'msg ' + m.role; n.dataset.i = i;
  if (m.role === 'user') { n.innerHTML = `<div class="bubble">${esc(m.content)}</div>`; return n; }
  n.innerHTML = `<div class="avatar">${I.logo}</div><div class="body">` +
    `<details class="think" hidden><summary></summary><div class="think-body"></div></details>` +
    `<div class="md"></div><div class="meta"></div></div>`;
  const body = n.querySelector('.body');
  const live = !!(S.stream && S.stream.msg === m);
  fillAssistant(body, m, live, isLast);
  if (live) S.stream.node = body;
  return n;
}

function fillAssistant(body, m, live, isLast) {
  const { thinking, content } = splitThink(m);
  const det = body.querySelector('.think');
  det.hidden = !thinking;
  if (thinking) {
    det.querySelector('.think-body').textContent = thinking;
    det.querySelector('summary').textContent = live && !content ? 'Thinking…' : 'Thought process';
  }
  const mdEl = body.querySelector('.md');
  mdEl.innerHTML = (live && !content && !thinking) ? '<span class="typing"><i></i><i></i><i></i></span>' : md(content);
  body.classList.toggle('streaming', live && !!content);
  const meta = body.querySelector('.meta');
  if (live) { meta.innerHTML = ''; return; }
  meta.innerHTML = `<button class="ghost" type="button" data-act="copy-msg" title="Copy" aria-label="Copy response">${I.copy}</button>` +
    (isLast ? `<button class="ghost" type="button" data-act="regen" title="Regenerate" aria-label="Regenerate response">${I.regen}</button>` : '') +
    `<span class="stat">${[m.model, m.stats].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('')}</span>`;
}

function renderThread(keepScroll) {
  const s = cur(), sc = $('#scroll'), th = $('#thread'), top = sc.scrollTop;
  th.innerHTML = '';
  if (!s || !s.messages.length) { th.appendChild(welcomeNode(s)); sc.scrollTop = 0; return; }
  const frag = document.createDocumentFragment();
  s.messages.forEach((m, i) => frag.appendChild(msgNode(m, i, s, i === s.messages.length - 1)));
  const lastMsg = s.messages[s.messages.length - 1];
  if (lastMsg.role === 'user' && !S.stream && S.connected) {
    const r = document.createElement('div'); r.className = 'retry';
    r.innerHTML = '<button type="button" data-act="retry">Retry response</button>';
    frag.appendChild(r);
  }
  th.appendChild(frag);
  sc.scrollTop = keepScroll ? top : sc.scrollHeight;
}

function renderHeader() {
  const s = cur(), chip = $('#sessionCfg');
  $('#chatTitle').textContent = s && s.messages.length ? s.title : 'New chat';
  chip.hidden = !(s && s.messages.length);
  if (!chip.hidden) chip.innerHTML = `${I.tune}<span>${esc(s.model || 'Choose model')} · ${esc(settingsSummary(s))}</span>`;
}

function renderComposer() {
  const s = cur(), ta = $('#input'), btn = $('#sendBtn');
  const busy = !!S.stream, here = busy && s && S.stream.sessionId === s.id;
  const can = !!(S.connected && s && s.model);
  ta.disabled = !can;
  ta.placeholder = !S.connected ? 'Connect to Ollama to start chatting'
    : !s || !s.model ? 'Choose a model to start'
    : busy && !here ? 'Another chat is still generating…'
    : `Message ${s.model}`;
  btn.innerHTML = here ? I.stop : I.send;
  btn.setAttribute('aria-label', here ? 'Stop generating' : 'Send');
  btn.disabled = here ? false : (!can || busy || !ta.value.trim());
  $('#footNote').textContent = 'Runs on your Ollama server. Chats are stored in this browser only.';
}

function renderAll() {
  renderSidebar(); renderConnection(); renderHeader(); renderThread(); renderComposer();
}

/* ================= Sending / streaming ================= */
async function send(text) {
  const s = cur();
  text = (text || '').trim();
  if (!s || S.stream || !text || !S.connected || !s.model) return;
  hideBanner();
  s.messages.push({ role: 'user', content: text });
  if (s.messages.length === 1) s.title = titleFrom(text);
  s.updatedAt = Date.now();
  store.set(K.model, s.model); store.set(K.system, s.system || ''); store.set('ollamachat.lastOptions', s.options || normalizeOptions());
  const ta = $('#input'); ta.value = ''; autosize();
  await generate(s);
}

async function generate(s) {
  const msg = { role: 'assistant', content: '', model: s.model };
  s.messages.push(msg);
  const ctrl = new AbortController();
  S.stream = { sessionId: s.id, abort: ctrl, msg, node: null };
  hideBanner(); save();
  renderSidebar(); renderHeader(); renderThread(); renderComposer();
  try {
    await streamChat(s, msg, ctrl);
  } catch (e) {
    if (e.name !== 'AbortError') {
      showBanner(e instanceof TypeError ? 'Lost the connection to Ollama. Check that it is still running, then retry.' : (e.message || 'Something went wrong.'));
    }
  } finally {
    if (S.stream && S.stream.msg === msg) S.stream = null;
    if (!msg.content && !msg.thinking) { const k = s.messages.indexOf(msg); if (k >= 0) s.messages.splice(k, 1); }
    s.updatedAt = Date.now();
    save();
    if (S.sessions.includes(s)) {
      renderSidebar(); renderComposer();
      if (S.currentId === s.id) renderThread(true);
    }
  }
}


function buildChatRequest(s, msgs) {
  const o = ensureSessionOptions(s);
  const options = {};
  // These are Ollama's model-generation options. Only explicitly configured values are sent.
  for (const key of ['temperature','top_p','top_k','min_p','repeat_penalty','seed','num_ctx','num_predict']) {
    if (o[key] !== null && o[key] !== undefined) options[key] = o[key];
  }
  const req = { model: s.model, messages: msgs, stream: true };
  if (Object.keys(options).length) req.options = options;
  if (o.think !== null) {
    req.think = (o.think === 'true') ? true :
                (o.think === 'false') ? false : o.think;
  }
  return req;
}

async function streamChat(s, msg, ctrl) {
  const msgs = [];
  if ((s.system || '').trim()) msgs.push({ role: 'system', content: s.system.trim() });
  for (const m of s.messages) {
    if (m === msg) continue;
    const c = splitThink(m).content;
    if (c) msgs.push({ role: m.role, content: c });
  }
  const res = await fetch(S.url + '/api/chat', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(buildChatRequest(s, msgs)),
    signal: ctrl.signal
  });
  if (!res.ok) {
    let t = ''; try { t = await res.text(); t = JSON.parse(t).error || t; } catch {}
    throw new Error(t || 'Ollama answered with HTTP ' + res.status);
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
      if (!line) continue;
      let j; try { j = JSON.parse(line); } catch { continue; }
      if (j.error) throw new Error(j.error);
      if (j.message) {
        if (j.message.content) msg.content += j.message.content;
        if (j.message.thinking) msg.thinking = (msg.thinking || '') + j.message.thinking;
        scheduleLive(); saveSoon();
      }
      if (j.done && j.eval_count && j.eval_duration) msg.stats = (j.eval_count / (j.eval_duration / 1e9)).toFixed(1) + ' tok/s';
    }
  }
}

let raf = 0;
function scheduleLive() {
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const st = S.stream;
    if (!st || !st.node || !st.node.isConnected) return;
    const sc = $('#scroll');
    const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 90;
    fillAssistant(st.node, st.msg, true, true);
    if (near) sc.scrollTop = sc.scrollHeight;
  });
}

function stop() { if (S.stream) S.stream.abort.abort(); }

function regen() {
  const s = cur();
  if (!s || S.stream || !S.connected) return;
  if (s.messages.length && s.messages[s.messages.length - 1].role === 'assistant') s.messages.pop();
  generate(s);
}

/* ================= UI plumbing ================= */
function showBanner(t) { $('#bannerText').textContent = t; $('#banner').hidden = false; }
function hideBanner() { $('#banner').hidden = true; }
function closeNav() { $('#app').classList.remove('nav-open'); }

function autosize() {
  const ta = $('#input');
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 200) + 'px';
}

async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove();
  }
  const old = btn.innerHTML;
  btn.innerHTML = I.check + (label ? '<span>Copied</span>' : '');
  setTimeout(() => { if (btn.isConnected) btn.innerHTML = old; }, 1400);
}

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#themeBtn').innerHTML = t === 'dark' ? I.sun : I.moon;
}

/* ================= Events ================= */
$('#brandMark').innerHTML = I.logo;
$('#newChat').innerHTML = I.plus + '<span>New chat</span>';
$('#menuBtn').innerHTML = I.menu;
applyTheme(document.documentElement.dataset.theme || 'light');

$('#themeBtn').addEventListener('click', () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set(K.theme, t); applyTheme(t);
});
$('#newChat').addEventListener('click', newChat);
$('#clearAll').addEventListener('click', clearAll);
$('#menuBtn').addEventListener('click', () => $('#app').classList.add('nav-open'));
$('#scrim').addEventListener('click', closeNav);
$('#bannerClose').addEventListener('click', hideBanner);

$('#urlForm').addEventListener('submit', e => { e.preventDefault(); connect($('#urlInput').value); });

$('#sessionList').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.closest('.s-item').dataset.id;
  if (b.dataset.act === 'open') { if (id !== S.currentId) switchTo(id); else closeNav(); }
  if (b.dataset.act === 'delete') deleteSession(id);
});

$('#thread').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const s = cur(), act = b.dataset.act;
  if (act === 'copy-code') copyText(b.closest('.code').querySelector('code').textContent, b, true);
  else if (act === 'copy-msg') { const m = s.messages[+b.closest('.msg').dataset.i]; copyText(splitThink(m).content, b, false); }
  else if (act === 'regen') regen();
  else if (act === 'retry') generate(s);
  else if (act === 'suggest') send(b.dataset.text);
  else if (act === 'focus-url') { $('#app').classList.add('nav-open'); $('#urlInput').focus(); }
  else if (act === 'preset') {
    const v = PRESETS[b.dataset.key] || '';
    s.system = v; const ta = $('#setupSystem'); if (ta) ta.value = v;
  }
});
$('#thread').addEventListener('change', e => {
  const s = cur();
  if (!s) return;
  if (e.target.id === 'setupModel') { s.model = e.target.value; store.set(K.model, s.model); renderComposer(); renderHeader(); }
  if (e.target.closest('[data-settings-prefix="setup"]')) {
    readSettingsFields($('#thread'), s, 'setup');
    updateSettingsPreview($('#thread'), 'setup', s);
    saveSoon();
  }
});
$('#thread').addEventListener('input', e => {
  const s = cur();
  if (!s) return;
  if (e.target.id === 'setupSystem') { s.system = e.target.value; saveSoon(); }
  if (e.target.closest('[data-settings-prefix="setup"]')) {
    readSettingsFields($('#thread'), s, 'setup');
    updateSettingsPreview($('#thread'), 'setup', s);
    saveSoon();
  }
});
$('#thread').addEventListener('input', e => {
  const s = cur();
  if (e.target.id === 'setupSystem' && s) s.system = e.target.value;
});

const input = $('#input');
input.addEventListener('input', () => { autosize(); renderComposer(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
$('#sendBtn').addEventListener('click', () => {
  const s = cur();
  if (S.stream && s && S.stream.sessionId === s.id) stop(); else send(input.value);
});

/* Per-chat settings dialog */
const dlg = $('#cfgDialog');
$('#sessionCfg').addEventListener('click', () => {
  const s = cur(); if (!s) return;
  ensureSessionOptions(s);
  $('#cfgModel').innerHTML = modelOptions(s.model);
  $('#cfgSystem').value = s.system || '';
  $('#cfgSettings').innerHTML = renderSettingsFields(s, 'cfg');
  $('#cfgSettings').addEventListener('input', () => {
    readSettingsFields($('#cfgSettings'), s, 'cfg');
    updateSettingsPreview($('#cfgSettings'), 'cfg', s);
  });
  dlg.showModal();
});
$('#cfgCancel').addEventListener('click', () => dlg.close());
$('#cfgSave').addEventListener('click', () => {
  const s = cur(); if (!s) return;
  s.model = $('#cfgModel').value || s.model;
  s.system = $('#cfgSystem').value;
  readSettingsFields($('#cfgSettings'), s, 'cfg');
  store.set(K.model, s.model); store.set(K.system, s.system);
  save(); dlg.close(); renderHeader(); renderComposer();
});
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ================= Init ================= */
$('#urlInput').value = S.url;
if (!cur()) { S.currentId = null; newChat(); }
else { S.sessions = S.sessions.filter(x => x.id === S.currentId || x.messages.length); renderAll(); }
if (S.url) connect(S.url);
})();
</script>
</body>
</html>
